<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project X — Google 3D Maps</title>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0b0e14;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    #map-root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #map-root gmp-map-3d {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Full-screen 2D ship layer above Google 3D (background only). */
    #ship-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }
    #trail-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #markers-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    /* SAVE-055 Adaptive Vessel Symbols (747fa52c) — exact CSS */
    .ship-icon {
      position: absolute;
      width: 24px;
      height: 24px;
      margin-left: -12px;
      margin-top: -12px;
      background: transparent !important;
      border: none !important;
      will-change: transform;
    }
    .ship-body {
      color: #1976d2;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }
    .ship-body--moving {
      font-size: 20px;
      font-weight: bold;
      line-height: 1;
      /* No CSS transition: camera heading sync must stay frame-accurate. */
    }
    .ship-body--stationary {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    #status {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 10;
      max-width: min(420px, calc(100% - 24px));
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(18, 21, 26, 0.92);
      color: #e8eaed;
      border: 1px solid #3a4556;
      font-size: 13px;
      line-height: 1.4;
      pointer-events: none;
    }
    #status[data-kind="ok"] { border-color: #2f6f4e; color: #b6f0d0; }
    #status[data-kind="warn"] { border-color: #8a6a2f; color: #f0e0b0; }
    #status[data-kind="error"] { border-color: #8a3a3a; color: #f0b0b0; }
    #status.hidden { display: none; }

    /* Location pick UX (separate from locked ship / selection layers). */
    #location-pick-overlay {
      position: absolute;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      z-index: 12;
      max-width: min(520px, calc(100% - 24px));
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(18, 21, 26, 0.94);
      color: #e8eaed;
      border: 1px solid #485da2;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    #location-pick-overlay[hidden] {
      display: none !important;
    }
    /* While picking a location, do not let ship/vessel UI steal map clicks. */
    body.location-pick-active #ship-hit-layer .ship-hit,
    body.location-pick-active #vessel-card-layer {
      pointer-events: none !important;
    }
  </style>
  <!-- P0: separate interaction layer (does not alter ship-overlay visuals). -->
  <style id="ship-hit-layer-style">
    #ship-hit-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 6;
      pointer-events: none;
      overflow: hidden;
    }
    #ship-hit-layer .ship-hit {
      position: absolute;
      width: 24px;
      height: 24px;
      margin-left: -12px;
      margin-top: -12px;
      pointer-events: auto;
      cursor: pointer;
      background: transparent;
    }
  </style>
  <!-- Selection highlight (separate from locked #ship-overlay visuals). -->
  <style id="ship-selection-layer-style">
    #ship-selection-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }
    /* Sit just above #ship-overlay markers (z-index 5) via DOM order + own z-index. */
    #ship-selection-layer {
      z-index: 5;
    }
    #ship-hit-layer { z-index: 6; }
    #vessel-card-layer { z-index: 7; }
    #ship-selection-layer .ship-select-icon {
      position: absolute;
      width: 24px;
      height: 24px;
      margin-left: -12px;
      margin-top: -12px;
      background: transparent;
      display: none;
    }
    #ship-selection-layer .ship-select-icon.visible {
      display: block;
    }
    #ship-selection-layer .ship-select-body {
      color: #e53935;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }
    #ship-selection-layer .ship-select-body--moving {
      font-size: 20px;
      font-weight: bold;
      line-height: 1;
    }
    #ship-selection-layer .ship-select-body--stationary {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
  </style>
  <!-- Vessel Card overlay (separate from locked #ship-overlay visuals). -->
  <style id="vessel-card-overlay-style">
    #vessel-card-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 7;
      pointer-events: none;
      overflow: hidden;
    }
    #vessel-card-layer .g3d-vessel-card-anchor {
      position: absolute;
      pointer-events: auto;
      transform: translate(-50%, calc(-100% - 18px));
      display: none;
    }
    #vessel-card-layer .g3d-vessel-card-anchor.visible {
      display: block;
    }
    #vessel-card-layer .g3d-vessel-card-close {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 2;
      width: 26px;
      height: 26px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      background: rgba(12, 16, 22, 0.88);
      color: #e8eaed;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }
    #vessel-card-layer .vessel-card {
      --vc-bg: rgba(18, 22, 30, 0.94);
      --vc-border: rgba(255, 255, 255, 0.08);
      --vc-text: #eef2f7;
      --vc-muted: #8b95a5;
      --vc-label: #7a8494;
      --vc-radius: 10px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--vc-text);
      background: var(--vc-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--vc-border);
      border-radius: var(--vc-radius);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.32);
      overflow: hidden;
      width: min(300px, calc(100vw - 48px));
    }
    #vessel-card-layer .vessel-card--compact { width: min(248px, calc(100vw - 48px)); }
    #vessel-card-layer .vessel-card--standard { width: min(280px, calc(100vw - 48px)); }
    #vessel-card-layer .vessel-card--detailed,
    #vessel-card-layer .vessel-card--media { width: min(300px, calc(100vw - 48px)); }
    #vessel-card-layer .vessel-card__scroll { display: flex; flex-direction: column; }
    #vessel-card-layer .vessel-card__scroll--scrollable {
      max-height: min(48vh, 360px);
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
    }
    #vessel-card-layer .vessel-card__hero {
      display: flex; gap: 8px; padding: 8px 10px 6px; align-items: flex-start;
    }
    #vessel-card-layer .vessel-card__identity { flex: 1; min-width: 0; }
    #vessel-card-layer .vessel-card__photo {
      position: relative; width: 68px; min-height: 50px; max-height: 58px;
      flex-shrink: 0; border-radius: 4px; overflow: hidden;
      background: rgba(255, 255, 255, 0.02);
      display: flex; align-items: center; justify-content: center;
    }
    #vessel-card-layer .vessel-card__photo-image {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    #vessel-card-layer .vessel-card__photo-image--hidden { display: none !important; }
    #vessel-card-layer .vessel-card__photo-placeholder {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; color: var(--vc-muted); font-size: 0.58rem; text-align: center; padding: 4px;
    }
    #vessel-card-layer .vessel-card__photo--placeholder .vessel-card__photo-placeholder,
    #vessel-card-layer .vessel-card__photo--fallback .vessel-card__photo-placeholder {
      display: flex;
    }
    #vessel-card-layer .vessel-card__photo-icon { width: 18px; height: 18px; opacity: 0.5; }
    #vessel-card-layer .vessel-card__title-row { display: flex; align-items: flex-start; gap: 6px; }
    #vessel-card-layer .vessel-card__flag {
      width: 22px; height: 15px; object-fit: contain; flex-shrink: 0; border-radius: 2px;
    }
    #vessel-card-layer .vessel-card__flag--hidden { display: none !important; }
    #vessel-card-layer .vessel-card__name {
      margin: 0; font-size: 0.88rem; font-weight: 700; line-height: 1.2;
      word-break: break-word; color: #f8fafc; flex: 1; min-width: 0;
    }
    #vessel-card-layer .vessel-card__type {
      margin-top: 2px; font-size: 0.66rem; color: var(--vc-muted); line-height: 1.2;
    }
    #vessel-card-layer .vessel-card__divider {
      height: 1px; background: rgba(255, 255, 255, 0.07); margin: 0;
    }
    #vessel-card-layer .vessel-card__row {
      display: block; padding: 3px 10px; min-width: 0;
    }
    #vessel-card-layer .vessel-card__label {
      display: block; font-size: 0.58rem; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--vc-label); line-height: 1.25; margin-bottom: 1px;
    }
    #vessel-card-layer .vessel-card__value {
      display: block; font-size: 0.74rem; font-weight: 500; color: var(--vc-text);
      word-break: break-word; line-height: 1.3;
    }
    #vessel-card-layer .vessel-card__value--empty { color: #5f6b7a; font-weight: 400; }
    #vessel-card-layer .vessel-card__value--on { color: #5eead4; font-weight: 600; }
    #vessel-card-layer .vessel-card__value--off { color: #9aa4af; font-weight: 500; }
    #vessel-card-layer .vessel-card__row--logbook { margin-top: 4px; }
    #vessel-card-layer .vessel-card__logbook-btn {
      width: 100%; border: 1px solid #1f4b7a; border-radius: 6px;
      background: #163552; color: white; font-size: 12px; font-weight: 600;
      padding: 8px 12px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="status" data-kind="info">Waiting for Google Maps API key from Project X…</div>
  <div id="map-root"></div>
  <div id="location-pick-overlay" hidden></div>
  <div id="ship-overlay" aria-hidden="true">
    <canvas id="trail-canvas"></canvas>
    <div id="markers-layer"></div>
  </div>
  <div id="ship-selection-layer" aria-hidden="true"></div>
  <div id="ship-hit-layer" aria-hidden="true"></div>
  <div id="vessel-card-layer" aria-hidden="true"></div>

  <script>
    /**
     * EXPERIMENT: Google 3D Maps as background / world only.
     * Ship layer = SAVE-055 Adaptive Vessel Symbols in a full-screen 2D overlay
     * (HTML/CSS markers + canvas trails). Marker3D / Polyline3D are NOT used.
     *
     * Source visuals: /tmp/ProjectX-SAVE055/src/resources/map/map.html (747fa52c)
     */

    const BUDAPEST = {
      center: { lat: 47.4979, lng: 19.0402, altitude: 120 },
      range: 2200,
      tilt: 62,
      heading: 25
    };

    // --- SAVE-055 map.html (exact) ---
    const MOVING_THRESHOLD_KN = 0.5;
    const TRAIL_RED = "red";
    const TRAIL_WEIGHT = 1;
    const TRAIL_MAX_POINTS = 50;
    const METERS_PER_DEG_LAT = 111320;

    let map3d = null;
    let mapsBootstrapped = false;
    let trailCanvas = null;
    let trailCtx = null;
    let markersLayer = null;
    let redrawScheduled = false;

    /** @type {Object.<string, HTMLElement>} */
    let ships = Object.create(null);
    /** @type {Object.<string, Array<{lat:number,lng:number}>>} */
    let trails = Object.create(null);
    /** Latest ship records (Project X full/patch → SAVE-055 list sync). */
    let knownShips = Object.create(null);

    function setStatus(message, kind) {
      const el = document.getElementById("status");
      if (!el) return;
      if (!message) {
        el.classList.add("hidden");
        return;
      }
      el.classList.remove("hidden");
      el.textContent = message;
      el.dataset.kind = kind || "info";
    }

    function shipLat(ship) {
      return Number(ship && ship.lat);
    }

    function shipLon(ship) {
      if (!ship) return NaN;
      if (ship.lon != null && ship.lon !== "") return Number(ship.lon);
      if (ship.lng != null && ship.lng !== "") return Number(ship.lng);
      return NaN;
    }

    function isValidAisShip(ship) {
      if (!ship || ship.mmsi == null || ship.mmsi === "") return false;
      const lat = shipLat(ship);
      const lon = shipLon(ship);
      return Number.isFinite(lat) && Number.isFinite(lon);
    }

    function shipSpeedKn(ship) {
      const speed = Number(ship && ship.speed);
      return Number.isFinite(speed) ? speed : 0;
    }

    // SAVE-055: course first, then heading
    function shipCourseDeg(ship) {
      const course = Number(ship && ship.course);
      if (Number.isFinite(course)) {
        return ((course % 360) + 360) % 360;
      }
      const heading = Number(ship && ship.heading);
      if (Number.isFinite(heading)) {
        return ((heading % 360) + 360) % 360;
      }
      return 0;
    }

    function isShipMoving(ship) {
      return shipSpeedKn(ship) >= MOVING_THRESHOLD_KN;
    }

    function mergeShipsPayload(payload) {
      if (Array.isArray(payload)) {
        knownShips = Object.create(null);
        for (const ship of payload) {
          if (!isValidAisShip(ship)) continue;
          knownShips[String(ship.mmsi)] = ship;
        }
        return;
      }

      if (!payload || typeof payload !== "object") return;

      if (payload.mode === "full") {
        knownShips = Object.create(null);
        for (const ship of payload.ships || []) {
          if (!isValidAisShip(ship)) continue;
          knownShips[String(ship.mmsi)] = ship;
        }
        return;
      }

      for (const ship of payload.upsert || []) {
        if (!isValidAisShip(ship)) continue;
        knownShips[String(ship.mmsi)] = ship;
      }

      for (const mmsi of payload.remove || []) {
        delete knownShips[String(mmsi)];
      }
    }

    // --- Map3D camera → screen projection (overlay placement only) ---

    function readCamera() {
      const c = map3d && map3d.center;
      const lat = Number(c && c.lat);
      const lng = Number(c && (c.lng != null ? c.lng : c.longitude));
      const altitude = Number(c && c.altitude);
      const range = Number(map3d && map3d.range);
      const tilt = Number(map3d && map3d.tilt);
      const heading = Number(map3d && map3d.heading);
      const roll = Number(map3d && map3d.roll);
      const fov = Number(map3d && map3d.fov);
      return {
        lat: Number.isFinite(lat) ? lat : BUDAPEST.center.lat,
        lng: Number.isFinite(lng) ? lng : BUDAPEST.center.lng,
        altitude: Number.isFinite(altitude) ? altitude : BUDAPEST.center.altitude,
        range: Number.isFinite(range) && range > 0 ? range : BUDAPEST.range,
        tilt: Number.isFinite(tilt) ? tilt : BUDAPEST.tilt,
        heading: Number.isFinite(heading) ? heading : BUDAPEST.heading,
        roll: Number.isFinite(roll) ? roll : 0,
        fov: Number.isFinite(fov) && fov > 0 ? fov : 35
      };
    }

    function latLngToEnu(lat, lng, alt, origin) {
      // Degrees → local ENU metres (METERS_PER_DEG_LAT is per degree, not radian).
      const dLatDeg = lat - origin.lat;
      const dLngDeg = lng - origin.lng;
      const cosLat = Math.cos((origin.lat * Math.PI) / 180);
      return {
        x: dLngDeg * cosLat * METERS_PER_DEG_LAT, // East
        y: dLatDeg * METERS_PER_DEG_LAT, // North
        z: (Number.isFinite(alt) ? alt : origin.altitude) - origin.altitude // Up
      };
    }

    function normalize(v) {
      const len = Math.hypot(v.x, v.y, v.z) || 1;
      return { x: v.x / len, y: v.y / len, z: v.z / len };
    }

    function cross(a, b) {
      return {
        x: a.y * b.z - a.z * b.y,
        y: a.z * b.x - a.x * b.z,
        z: a.x * b.y - a.y * b.x
      };
    }

    function dot(a, b) {
      return a.x * b.x + a.y * b.y + a.z * b.z;
    }

    /**
     * Project lat/lng (on look-at altitude plane) → overlay CSS pixels.
     * Uses Map3D center/range/tilt/heading/fov/roll — same camera the 3D map uses.
     */
    function projectLatLng(lat, lng, cam, width, height) {
      const tilt = (cam.tilt * Math.PI) / 180;
      const heading = (cam.heading * Math.PI) / 180;
      const roll = (cam.roll * Math.PI) / 180;
      const range = cam.range;

      // Camera eye in ENU relative to look-at (tilt 0 = nadir / top-down).
      const camPos = {
        x: -Math.sin(heading) * Math.sin(tilt) * range,
        y: -Math.cos(heading) * Math.sin(tilt) * range,
        z: Math.cos(tilt) * range
      };

      const target = { x: 0, y: 0, z: 0 };
      let forward = normalize({
        x: target.x - camPos.x,
        y: target.y - camPos.y,
        z: target.z - camPos.z
      });

      // Screen-right when heading=0 (looking north): +East
      let right = normalize({
        x: Math.cos(heading),
        y: -Math.sin(heading),
        z: 0
      });
      let up = normalize(cross(right, forward));
      // Re-orthogonalize right against forward/up
      right = normalize(cross(forward, up));

      if (roll !== 0) {
        const cosR = Math.cos(roll);
        const sinR = Math.sin(roll);
        const rightR = {
          x: right.x * cosR + up.x * sinR,
          y: right.y * cosR + up.y * sinR,
          z: right.z * cosR + up.z * sinR
        };
        const upR = {
          x: up.x * cosR - right.x * sinR,
          y: up.y * cosR - right.y * sinR,
          z: up.z * cosR - right.z * sinR
        };
        right = normalize(rightR);
        up = normalize(upR);
      }

      const p = latLngToEnu(lat, lng, cam.altitude, cam);
      const vx = p.x - camPos.x;
      const vy = p.y - camPos.y;
      const vz = p.z - camPos.z;

      const xCam = vx * right.x + vy * right.y + vz * right.z;
      const yCam = vx * up.x + vy * up.y + vz * up.z;
      const zCam = vx * forward.x + vy * forward.y + vz * forward.z;
      if (!(zCam > 1e-3)) return null;

      const aspect = width / Math.max(height, 1);
      const fovY = (cam.fov * Math.PI) / 180;
      const fScale = 1 / Math.tan(fovY / 2);
      const ndcX = ((xCam / zCam) * fScale) / aspect;
      const ndcY = (yCam / zCam) * fScale;

      return {
        x: (ndcX + 1) * 0.5 * width,
        y: (1 - ndcY) * 0.5 * height
      };
    }

    // Observation-point right-click hit-test reuses this projection.
    // Does not change ship-overlay drawing.
    window.__projectxProjectLatLng = function projectLatLngToMapRoot(lat, lng) {
      const root = document.getElementById("map-root");
      const width = (root && root.clientWidth) || window.innerWidth || 1;
      const height = (root && root.clientHeight) || window.innerHeight || 1;
      return projectLatLng(Number(lat), Number(lng), readCamera(), width, height);
    };

    function resizeTrailCanvas() {
      if (!trailCanvas) return;
      const dpr = window.devicePixelRatio || 1;
      const w = trailCanvas.clientWidth || window.innerWidth;
      const h = trailCanvas.clientHeight || window.innerHeight;
      const pw = Math.max(1, Math.round(w * dpr));
      const ph = Math.max(1, Math.round(h * dpr));
      if (trailCanvas.width !== pw || trailCanvas.height !== ph) {
        trailCanvas.width = pw;
        trailCanvas.height = ph;
      }
      if (trailCtx) {
        trailCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    }

    function scheduleOverlayRedraw() {
      if (redrawScheduled) return;
      redrawScheduled = true;
      requestAnimationFrame(function () {
        redrawScheduled = false;
        redrawOverlay();
      });
    }

    /**
     * SAVE-055 uses CSS rotate(course) on a north-up Leaflet map (screen-up = N).
     * On Map3D, screen-up follows camera heading — subtract heading so course 0° = N.
     */
    function markerScreenRotationDeg(ship) {
      const course = shipCourseDeg(ship);
      const heading = Number(map3d && map3d.heading);
      const H = Number.isFinite(heading) ? heading : 0;
      return course - H;
    }

    function updateMarkerAppearance(element, ship) {
      let body = element.querySelector(".ship-body");
      if (!body) {
        body = document.createElement("div");
        body.className = "ship-body";
        element.appendChild(body);
      }

      if (isShipMoving(ship)) {
        body.classList.add("ship-body--moving");
        body.classList.remove("ship-body--stationary");
        body.textContent = "▲";
        body.style.transform =
          "rotate(" + markerScreenRotationDeg(ship) + "deg)";
        return;
      }

      body.classList.remove("ship-body--moving");
      body.classList.add("ship-body--stationary");
      body.textContent = "";
      body.style.transform = "";
    }

    function ensureMarker(mmsi) {
      if (ships[mmsi]) return ships[mmsi];
      const el = document.createElement("div");
      el.className = "ship-icon";
      el.dataset.mmsi = mmsi;
      el.innerHTML = "<div class='ship-body'></div>";
      markersLayer.appendChild(el);
      ships[mmsi] = el;
      return el;
    }

    function removeMarker(mmsi) {
      const el = ships[mmsi];
      if (!el) return;
      try {
        el.remove();

        const lon = shipLon(ship);

    function redrawOverlay() {

      const height = trailCanvas.clientHeight || window.innerHeight;
      const cam = readCamera();

      trailCtx.clearRect(0, 0, width, height);
      trailCtx.lineWidth = TRAIL_WEIGHT;
      trailCtx.strokeStyle = TRAIL_RED;
      trailCtx.lineJoin = "round";
      trailCtx.lineCap = "round";

      const mmsis = Object.keys(knownShips);
      for (let i = 0; i < mmsis.length; i++) {
        const mmsi = mmsis[i];
        const ship = knownShips[mmsi];
        if (!isValidAisShip(ship)) continue;

        const marker = ships[mmsi];
        if (!marker) continue;

        const lat = shipLat(ship);
        const lon = shipLon(ship);
        const screen = projectLatLng(lat, lon, cam, width, height);
        if (!screen) {
          marker.style.display = "none";
        } else {
          marker.style.display = "";
          marker.style.left = screen.x + "px";
          marker.style.top = screen.y + "px";
        }

        // Heading can change while panning — keep course aligned to map north.
        if (isShipMoving(ship)) {
          const body = marker.querySelector(".ship-body");
          if (body) {
            body.style.transform =
              "rotate(" + markerScreenRotationDeg(ship) + "deg)";
          }

        const line = trails[mmsi];
        if (!line || line.length < 2) continue;

        trailCtx.beginPath();
        let started = false;
        for (let j = 0; j < line.length; j++) {
          const pt = projectLatLng(line[j].lat, line[j].lng, cam, width, height);
          if (!pt) {
            started = false;
            continue;
          }
          if (!started) {
            trailCtx.moveTo(pt.x, pt.y);
            started = true;
          } else {
            trailCtx.lineTo(pt.x, pt.y);
          }
        }
        if (started) trailCtx.stroke();
      }

      // Hide markers that are no longer known (safety).
      Object.keys(ships).forEach(function (mmsi) {
        if (knownShips[mmsi]) return;

      function getMarkerCtor() {

      function isInteractiveMarker(marker) {
        if (!marker) return false;
        const name = String(marker.localName || marker.tagName || "").toLowerCase();
        return name.indexOf("interactive") !== -1;
      }

      function isLocationPickUiActive() {
        const el = document.getElementById("location-pick-overlay");
        return !!(el && !el.hidden);
      }

      async function ensurePinElement() {
        if (PinElementCtor) return PinElementCtor;
        if (!(window.google && google.maps && google.maps.importLibrary)) {
          return null;
        }
        const lib = await google.maps.importLibrary("marker");
        PinElementCtor = lib.PinElement || null;
        return PinElementCtor;
      }

      function makePin(active, PinElement) {
        // Match Leaflet map.html: active green #43a047, inactive red #e53935.
        return new PinElement({
          background: active ? "#43a047" : "#e53935",
          borderColor: "#ffffff",
          glyphColor: "#ffffff",
          scale: 1.05
        });
      }

      function reportObservationContextMenu(pointId) {
        if (isLocationPickUiActive()) return;
        const id = String(pointId || "");
        if (!id) return;
        const bridge = window.__projectxMapBridge;
        if (bridge && typeof bridge.observationContextMenu === "function") {
          bridge.observationContextMenu(id);
        }
      }

      // Marker3DInteractiveElement does not fire DOM contextmenu. Hit-test the
      // pin in screen space (same projection as the ship overlay).
      const PIN_HIT_RADIUS_PX = 28;
      const PIN_BODY_OFFSET_Y = 20;
      let contextMenuBound = false;

      function mapRootRect() {
        const root = document.getElementById("map-root");
        if (root && typeof root.getBoundingClientRect === "function") {
          return root.getBoundingClientRect();
        }
        return {
          left: 0,
          top: 0,
          width: window.innerWidth || 1,
          height: window.innerHeight || 1
        };
      }

      function observationIdAtClient(clientX, clientY) {
        const project = window.__projectxProjectLatLng;
        if (typeof project !== "function") return "";
        const rect = mapRootRect();
        const x = Number(clientX) - rect.left;
        const y = Number(clientY) - rect.top;
        let bestId = "";
        let bestDist = PIN_HIT_RADIUS_PX;
        for (const pointId in observationMarkers) {
          const entry = observationMarkers[pointId];
          const lat = Number(entry && entry.lat);
          const lon = Number(entry && entry.lon);
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
          const screen = project(lat, lon);
          if (!screen) continue;
          const dx = x - screen.x;
          const dy = y - (screen.y - PIN_BODY_OFFSET_Y);
          const dist = Math.hypot(dx, dy);
          if (dist <= bestDist) {

            bestId = pointId;

        if (!target || typeof target.closest !== "function") return false;

          target.closest(".ship-hit") ||
          target.closest(".g3d-vessel-card-anchor")

      }

      function onContextMenuCapture(event) {
        if (isLocationPickUiActive()) return;
        if (eventFromUiOverlay(event)) return;
        const id = observationIdAtClient(event.clientX, event.clientY);
        if (!id) return;
        if (typeof event.preventDefault === "function") event.preventDefault();
        if (typeof event.stopPropagation === "function") event.stopPropagation();
        if (typeof event.stopImmediatePropagation === "function") {

        }

      }

      function onPointerDownCapture(event) {

        if (isLocationPickUiActive()) return;

        const id = observationIdAtClient(event.clientX, event.clientY);

        for (const pointId in observationMarkers) {

      function focusReferenceIfSafe(list) {

        const map = getMap();
        if (!map || !list.length) return;
        let focus = null;
        for (let i = 0; i < list.length; i++) {
          if (list[i] && list[i].reference) {
            focus = list[i];
            break;
          }
        }
        if (!focus) focus = list[0];
        const lat = Number(focus.lat);
        const lon = Number(focus.lon);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
        const radiusKm = Number(focus.coverage_radius_km);
        const range = Number.isFinite(radiusKm) && radiusKm > 0
          ? Math.max(radiusKm * 1000 * 2.2, 8000)
          : 50000;
        try {
          // Prefer property assignment over flyCameraTo — fly can drop Marker3D children.
          map.center = { lat: lat, lng: lon, altitude: 80 };

        } catch (err) {
          console.warn("observation focus", err);
        }
      }

      async function updateObservationPoints(points) {
        const list = Array.isArray(points) ? points : [];
        const seq = ++updateSeq;
        const map = getMap();
        const Marker3DElement = getMarkerCtor();
        if (!map || !Marker3DElement) {
          pendingPoints = list;
          return;
        }

        pendingPoints = null;
        let PinElement = null;
        try {
          PinElement = await ensurePinElement();
        } catch (err) {
          console.warn("observation PinElement", err);
        }
        if (seq !== updateSeq) return;

        const seen = Object.create(null);
        for (let i = 0; i < list.length; i++) {
          const point = list[i] || {};
          const pointId = String(point.id || "");
          if (!pointId) continue;
          const lat = Number(point.lat);
          const lon = Number(point.lon);
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;

          const isActive = !!point.active;
          const name = String(point.name || "");
          seen[pointId] = true;

          let entry = observationMarkers[pointId];

            entry = null;

            const marker = new Marker3DElement({
              position: { lat: lat, lng: lon, altitude: 0 },
              altitudeMode: "CLAMP_TO_GROUND",
              drawsWhenOccluded: true,
              sizePreserved: true,
              label: name
            });
            if (PinElement) {
              marker.append(makePin(isActive, PinElement));
            }
            map.append(marker);
            observationMarkers[pointId] = {
              marker: marker,
              active: isActive,
              name: name,
              lat: lat,
              lon: lon

          try {
            entry.marker.position = { lat: lat, lng: lon, altitude: 0 };

            }
          }
          entry.name = name;
          entry.lat = lat;
          entry.lon = lon;
        }

        for (const pointId in observationMarkers) {
          if (seen[pointId]) continue;
          try {
            observationMarkers[pointId].marker.remove();
          } catch (_err) {
            /* ignore */
          }
          delete observationMarkers[pointId];

          } catch (_err) {
            /* ignore */
          }

        }

        });
      };

      window.__projectxResetObservationPointMarkers = resetObservationPointMarkers;
      bindObservationContextMenuCapture();
      window.__projectxObservationMarkerDebug = function observationMarkerDebug() {
        const tracked = [];

          domMarkers: document.querySelectorAll("gmp-marker-3d").length,

      };
    })();

          console.warn("catalog camera PinElement", err);
        }
        if (seq !== updateSeq) return;
        if (!PinElement) {
          pendingCameras = list;
          return;
        }

        pendingCameras = null;

        const seen = Object.create(null);
        for (let i = 0; i < list.length; i++) {
          const camera = list[i] || {};
          const cameraId = String(camera.id || "");
          if (!cameraId) continue;
          const lat = Number(camera.lat);
          const lon = Number(camera.lon);
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
          if (lat === 0 && lon === 0) continue;

          seen[cameraId] = true;

          let entry = cameraMarkers[cameraId];
          if (entry && entry.marker && !isInteractiveMarker(entry.marker)
              && window.__projectxMarker3DInteractiveElement) {
            try {
              entry.marker.remove();
            } catch (_err) {
              /* ignore */
            }
            delete cameraMarkers[cameraId];
            entry = null;
          }
          if (!entry || !entry.marker) {
            const marker = new Marker3DInteractiveElement({
              position: { lat: lat, lng: lon, altitude: 0 },
              altitudeMode: "CLAMP_TO_GROUND",
              drawsWhenOccluded: true,
              sizePreserved: true
            });
            marker.append(makeCameraGlyph(PinElement));
            bindCameraClick(marker, cameraId);
            map.append(marker);
            cameraMarkers[cameraId] = { marker: marker };
            continue;
          }

          try {
            entry.marker.position = { lat: lat, lng: lon, altitude: 0 };
            entry.marker.sizePreserved = true;
            entry.marker.label = "";
          } catch (err) {
            console.warn("catalog camera marker update", err);
          }
        }

        for (const cameraId in cameraMarkers) {
          if (seen[cameraId]) continue;
          try {
            cameraMarkers[cameraId].marker.remove();
          } catch (_err) {
            /* ignore */
          }
          delete cameraMarkers[cameraId];
        }
      }

      function clearCatalogCameras() {
        pendingCameras = [];
        updateSeq += 1;
        for (const cameraId in cameraMarkers) {
          try {
            cameraMarkers[cameraId].marker.remove();
          } catch (_err) {
            /* ignore */
          }
          delete cameraMarkers[cameraId];
        }
      }

      function flushCatalogCameras() {
        if (pendingCameras == null) return;
        const queued = pendingCameras;
        pendingCameras = null;
        Promise.resolve(updateCatalogCameras(queued)).catch(function (err) {
          console.warn("flushCatalogCameras", err);
        });
      }

      function flushPendingCameraClick() {
        if (pendingCameraId == null) return;
        reportCamera(pendingCameraId);
      }

      window.updateCatalogCameras = function updateCatalogCamerasApi(cameras) {
        Promise.resolve(updateCatalogCameras(cameras)).catch(function (err) {
          console.warn("updateCatalogCameras", err);
        });
      };
      window.clearCatalogCameras = clearCatalogCameras;
      window.__projectxFlushCatalogCameras = flushCatalogCameras;
      window.__projectxResetCatalogCameraMarkers = resetCatalogCameraMarkers;
      window.__projectxFlushPendingCameraClick = flushPendingCameraClick;
    })();
  </script>
  <!--
    Location pick for Observation Point create/edit.
    Uses official Map3DElement gmp-click → LatLngAltitude.position.
    Does NOT use #ship-overlay projection / markers / trails.
  -->
  <script>
    (function installGoogle3dLocationPick() {
      let pickEnabled = false;
      let pickMarker = null;
      let Marker3DElementCtor = null;
      let boundMap = null;
      let pendingPickLocation = null;
      let bridgeFlushTimer = 0;

      function overlayEl() {
        return document.getElementById("location-pick-overlay");
      }

      function showPickOverlay(message) {
        const el = overlayEl();
        if (!el) return;
        const text = String(message || "").trim();
        if (!text) {
          el.hidden = true;
          el.textContent = "";
          return;
        }
        el.textContent = text;
        el.hidden = false;
      }

      function dismissPickOverlay() {
        showPickOverlay("");
      }

      function setPickActive(active) {
        pickEnabled = !!active;
        document.body.classList.toggle("location-pick-active", pickEnabled);
      }

      function getBridge() {
        return window.__projectxMapBridge || null;
      }

      function flushPendingPick() {
        if (!pendingPickLocation) return;
        const bridge = getBridge();
        if (!bridge || typeof bridge.reportLocation !== "function") return;
        const { lat, lon } = pendingPickLocation;
        pendingPickLocation = null;
        try {
          bridge.reportLocation(lat, lon);
        } catch (err) {
          console.warn("reportLocation", err);
        }
      }

      function reportPickLocation(lat, lon) {
        const bridge = getBridge();
        if (bridge && typeof bridge.reportLocation === "function") {
          pendingPickLocation = null;
          try {
            bridge.reportLocation(lat, lon);
          } catch (err) {
            console.warn("reportLocation", err);
          }
          return;
        }
        pendingPickLocation = { lat: lat, lon: lon };
        if (!bridgeFlushTimer) {
          bridgeFlushTimer = window.setInterval(function () {
            flushPendingPick();
            if (!pendingPickLocation) {
              window.clearInterval(bridgeFlushTimer);
              bridgeFlushTimer = 0;
            }
          }, 100);
        }
      }

      function readClickLatLng(event) {
        const pos = event && event.position;
        if (!pos) return null;
        const lat =
          typeof pos.lat === "function" ? Number(pos.lat()) : Number(pos.lat);
        const lng =
          typeof pos.lng === "function" ? Number(pos.lng()) : Number(pos.lng);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
        return { lat: lat, lng: lng };
      }

      async function ensureMarkerCtor() {
        if (Marker3DElementCtor) return Marker3DElementCtor;
        if (window.__projectxMarker3DElement) {
          Marker3DElementCtor = window.__projectxMarker3DElement;
          return Marker3DElementCtor;
        }
        if (!(window.google && google.maps && google.maps.importLibrary)) {
          return null;
        }
        const lib = await google.maps.importLibrary("maps3d");
        Marker3DElementCtor = lib.Marker3DElement || null;
        if (Marker3DElementCtor) {
          window.__projectxMarker3DElement = Marker3DElementCtor;
        }
        return Marker3DElementCtor;
      }

      function clearPickMarker() {
        if (pickMarker) {
          try {
            pickMarker.remove();
          } catch (_err) {
            /* ignore */
          }
          pickMarker = null;
        }
      }

      function placePickMarker(latitude, longitude, Marker3DElement) {
        const map = window.__projectxGoogle3dMap;
        if (!map || !Marker3DElement) return false;
        clearPickMarker();
        pickMarker = new Marker3DElement({
          position: { lat: latitude, lng: longitude },
          drawsWhenOccluded: true
        });
        map.append(pickMarker);
        return true;
      }

      function setPickMarker(lat, lon) {
        const latitude = Number(lat);
        const longitude = Number(lon);
        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
          return Promise.resolve(false);
        }

        const cached =
          Marker3DElementCtor || window.__projectxMarker3DElement || null;
        if (cached) {
          try {
            return Promise.resolve(
              placePickMarker(latitude, longitude, cached)
            );
          } catch (err) {
            console.warn("setPickMarker", err);
            window.__projectxPickMarkerError = String(
              err && err.message ? err.message : err
            );
            return Promise.resolve(false);
          }
        }

        return ensureMarkerCtor()
          .then(function (Ctor) {
            if (!Ctor) {
              window.__projectxPickMarkerError = "Marker3DElement unavailable";
              return false;
            }
            return placePickMarker(latitude, longitude, Ctor);
          })
          .catch(function (err) {
            console.warn("setPickMarker", err);
            window.__projectxPickMarkerError = String(
              err && err.message ? err.message : err
            );
            return false;
          });
      }

      function onGmpClick(event) {
        if (!pickEnabled) return;
        const coords = readClickLatLng(event);
        if (!coords) return;
        try {
          if (typeof event.preventDefault === "function") event.preventDefault();
        } catch (_err) {
          /* ignore */
        }
        dismissPickOverlay();
        reportPickLocation(coords.lat, coords.lng);
        // Place immediately and once more after the click stack settles.
        function place() {
          try {
            setPickMarker(coords.lat, coords.lng);
          } catch (err) {
            console.warn("pick marker", err);
          }
        }
        place();
        window.setTimeout(place, 0);
        window.setTimeout(place, 50);
      }

      function bindLocationPick() {
        const map = window.__projectxGoogle3dMap;
        if (!map) return;
        if (boundMap === map) return;
        if (boundMap) {
          try {
            boundMap.removeEventListener("gmp-click", onGmpClick);
          } catch (_err) {
            /* ignore */
          }
        }
        map.addEventListener("gmp-click", onGmpClick);
        boundMap = map;
      }

      window.__projectxBindLocationPick = bindLocationPick;

      function enablePickMode(enabled) {
        setPickActive(!!enabled);
        bindLocationPick();
        if (!pickEnabled) clearPickMarker();
      }

      function beginLocationPick(message) {
        setPickActive(true);
        clearPickMarker();
        showPickOverlay(message || "");
        bindLocationPick();
        // Intentionally do NOT call resetMapToWorldView(): Map3D flyCameraTo
        // can drop Marker3D children mid-animation, wiping the pick pin.
      }

      function refreshLocationPickView(message) {
        setPickActive(true);
        showPickOverlay(message || "");
        bindLocationPick();
      }

      function endLocationPick() {
        setPickActive(false);
        pendingPickLocation = null;
        // Keep the Marker3D pick pin visible until the next begin/clear so the
        // chosen point remains on screen while the wizard returns (~750ms).
        dismissPickOverlay();
      }

      function setPickOverlay(message) {
        showPickOverlay(message || "");
      }

      window.enablePickMode = enablePickMode;
      window.beginLocationPick = beginLocationPick;
      window.refreshLocationPickView = refreshLocationPickView;
      window.endLocationPick = endLocationPick;
      window.setPickMarker = setPickMarker;
      window.clearPickMarker = clearPickMarker;
      window.setPickOverlay = setPickOverlay;

      bindLocationPick();
    })();
  </script>
  <!--
    P0 ship hit-test / QWebChannel selection layer.
    Reads marker screen positions from #markers-layer; does not modify
    ship-overlay drawing, projection, trails, or SAVE-055 visuals.
  -->
  <script>
    (function installShipHitLayer() {
      const HIT_LAYER_ID = "ship-hit-layer";
      const MARKERS_LAYER_ID = "markers-layer";
      let bridge = null;
      let pendingMmsi = null;
      let rafId = 0;

      function ensureHitLayer() {
        let layer = document.getElementById(HIT_LAYER_ID);
        if (!layer) {
          layer = document.createElement("div");
          layer.id = HIT_LAYER_ID;
          layer.setAttribute("aria-hidden", "true");
          document.body.appendChild(layer);
        }
        return layer;
      }

      function reportShip(mmsi) {
        const id = Number(mmsi);
        if (!Number.isFinite(id)) return;
        if (typeof window.setSelectedShipHighlight === "function") {
          window.setSelectedShipHighlight(id);
        }
        if (bridge && typeof bridge.selectShip === "function") {
          bridge.selectShip(id);
          pendingMmsi = null;
          return;
        }
        pendingMmsi = id;
      }

      function onHitClick(event) {
        event.preventDefault();
        event.stopPropagation();
        const hit = event.currentTarget;
        if (!hit) return;
        reportShip(hit.dataset.mmsi);
      }

      function syncHitTargetsFromMarkers() {
        const layer = ensureHitLayer();
        const markersRoot = document.getElementById(MARKERS_LAYER_ID);
        if (!markersRoot) {
          rafId = requestAnimationFrame(syncHitTargetsFromMarkers);
          return;
        }

        const icons = markersRoot.querySelectorAll(".ship-icon[data-mmsi]");
        const existing = Object.create(null);
        const currentHits = layer.querySelectorAll(".ship-hit");
        for (let i = 0; i < currentHits.length; i++) {
          existing[String(currentHits[i].dataset.mmsi || "")] = currentHits[i];
        }

        const seen = Object.create(null);
        for (let i = 0; i < icons.length; i++) {
          const icon = icons[i];
          const mmsi = String(icon.dataset.mmsi || "");
          if (!mmsi) continue;
          seen[mmsi] = true;

          let hit = existing[mmsi];
          if (!hit) {
            hit = document.createElement("div");
            hit.className = "ship-hit";
            hit.dataset.mmsi = mmsi;
            hit.addEventListener("click", onHitClick);
            layer.appendChild(hit);
          }

          hit.style.left = icon.style.left || "";
          hit.style.top = icon.style.top || "";
          hit.style.display = icon.style.display || "";
        }

        for (const mmsi in existing) {
          if (!seen[mmsi]) {
            existing[mmsi].remove();
          }
        }

        rafId = requestAnimationFrame(syncHitTargetsFromMarkers);
      }

      function initBridge() {
        if (bridge) return;
        if (typeof qt === "undefined" || typeof QWebChannel === "undefined") {
          setTimeout(initBridge, 100);
          return;
        }
        new QWebChannel(qt.webChannelTransport, function (channel) {
          bridge = channel.objects.bridge || null;
          window.__projectxMapBridge = bridge;
          if (pendingMmsi != null) {
            reportShip(pendingMmsi);
          }
          if (typeof window.__projectxFlushPendingCameraClick === "function") {
            window.__projectxFlushPendingCameraClick();
          }
        });
      }

      ensureHitLayer();
      initBridge();
      if (!rafId) {
        rafId = requestAnimationFrame(syncHitTargetsFromMarkers);
      }
    })();
  </script>
  <!--
    Google 3D Vessel Card: 2D HTML overlay above the selected ship.
    Follows marker screen positions from #markers-layer; does not modify
    ship-overlay drawing, projection, trails, or SAVE-055 visuals.
  -->
  <script>
    (function installVesselCardOverlay() {
      const LAYER_ID = "vessel-card-layer";
      const MARKERS_LAYER_ID = "markers-layer";
      let selectedMmsi = null;
      let cardHtml = "";
      let anchor = null;
      let rafId = 0;
      let bridge = null;

      function ensureLayer() {
        let layer = document.getElementById(LAYER_ID);
        if (!layer) {
          layer = document.createElement("div");
          layer.id = LAYER_ID;
          layer.setAttribute("aria-hidden", "true");
          document.body.appendChild(layer);
        }
        return layer;
      }

      function ensureAnchor() {
        const layer = ensureLayer();
        if (anchor && anchor.isConnected) return anchor;
        anchor = document.createElement("div");
        anchor.className = "g3d-vessel-card-anchor";
        layer.appendChild(anchor);
        return anchor;
      }

      function attachHandlers(root) {
        if (!root) return;
        const closeBtn = root.querySelector(".g3d-vessel-card-close");
        if (closeBtn) {
          closeBtn.onclick = function (event) {
            event.preventDefault();
            event.stopPropagation();
            window.clearSelectedVesselCard();
            if (bridge && typeof bridge.clearShipSelection === "function") {
              bridge.clearShipSelection();
            }
          };
        }
        root.querySelectorAll(".vessel-card__logbook-btn").forEach(function (btn) {
          btn.onclick = function (event) {
            event.preventDefault();
            event.stopPropagation();
            const mmsi = Number(btn.getAttribute("data-mmsi"));
            if (!Number.isFinite(mmsi)) return;
            if (bridge && typeof bridge.openLogbook === "function") {
              bridge.openLogbook(mmsi);
            }
          };
        });
        // Keep map camera interactions from swallowing card scroll/clicks.
        root.addEventListener("wheel", function (event) {
          event.stopPropagation();
        }, { passive: true });
        root.addEventListener("pointerdown", function (event) {
          event.stopPropagation();
        });
      }

      function renderCard() {
        const el = ensureAnchor();
        if (!selectedMmsi || !cardHtml) {
          el.classList.remove("visible");
          el.innerHTML = "";
          return;
        }
        el.innerHTML =
          '<button type="button" class="g3d-vessel-card-close" aria-label="Close">×</button>' +
          cardHtml;
        el.classList.add("visible");
        attachHandlers(el);
      }

      function syncCardPosition() {
        const el = ensureAnchor();
        if (!selectedMmsi || !cardHtml) {
          el.classList.remove("visible");
          rafId = requestAnimationFrame(syncCardPosition);
          return;
        }

        const markersRoot = document.getElementById(MARKERS_LAYER_ID);
        const icon = markersRoot
          ? markersRoot.querySelector(
              '.ship-icon[data-mmsi="' + String(selectedMmsi) + '"]'
            )
          : null;

        if (!icon || icon.style.display === "none") {
          el.classList.remove("visible");
        } else {
          if (!el.classList.contains("visible") || !el.innerHTML) {
            renderCard();
          }
          el.style.left = icon.style.left || "";
          el.style.top = icon.style.top || "";
          el.classList.add("visible");
        }
        rafId = requestAnimationFrame(syncCardPosition);
      }

      window.setSelectedVesselCard = function setSelectedVesselCard(payload) {
        try {
          const data = payload || {};
          const mmsi = data.mmsi;
          const html = data.html || "";
          if (mmsi == null || !html) {
            window.clearSelectedVesselCard();
            return;
          }
          selectedMmsi = String(mmsi);
          cardHtml = String(html);
          if (typeof window.setSelectedShipHighlight === "function") {
            window.setSelectedShipHighlight(selectedMmsi);
          }
          renderCard();
        } catch (err) {
          console.warn("setSelectedVesselCard", err);
        }
      };

      window.clearSelectedVesselCard = function clearSelectedVesselCard() {
        selectedMmsi = null;
        cardHtml = "";
        if (anchor) {
          anchor.classList.remove("visible");
          anchor.innerHTML = "";
        }
        if (typeof window.setSelectedShipHighlight === "function") {
          window.setSelectedShipHighlight(null);
        }
      };

      function initBridge() {
        if (bridge) return;
        if (window.__projectxMapBridge) {
          bridge = window.__projectxMapBridge;
          return;
        }
        // Hit-layer owns QWebChannel init; wait for it (avoid dual channels).
        setTimeout(initBridge, 100);
      }

      ensureLayer();
      initBridge();
      if (!rafId) {
        rafId = requestAnimationFrame(syncCardPosition);
      }
    })();
  </script>
  <!--
    Selected-ship red highlight. Separate layer — does not modify
    #ship-overlay markers, trails, projection, size, or rotation logic.
    Follows the selected MMSI marker screen position from #markers-layer.
  -->
  <script>
    (function installShipSelectionLayer() {
      const LAYER_ID = "ship-selection-layer";
      const MARKERS_LAYER_ID = "markers-layer";
      let selectedMmsi = null;
      let iconEl = null;
      let rafId = 0;

      function ensureLayer() {
        let layer = document.getElementById(LAYER_ID);
        if (!layer) {
          layer = document.createElement("div");
          layer.id = LAYER_ID;
          layer.setAttribute("aria-hidden", "true");
          document.body.appendChild(layer);
        }
        return layer;
      }

      function ensureIcon() {
        const layer = ensureLayer();
        if (iconEl && iconEl.isConnected) return iconEl;
        iconEl = document.createElement("div");
        iconEl.className = "ship-select-icon";
        iconEl.innerHTML = '<div class="ship-select-body"></div>';
        layer.appendChild(iconEl);
        return iconEl;
      }

      function updateAppearance(ship, sourceIcon) {
        const el = ensureIcon();
        const body = el.querySelector(".ship-select-body");
        if (!body) return;
        const moving =
          typeof isShipMoving === "function"
            ? isShipMoving(ship)
            : Number(ship && ship.speed) >= 0.5;
        body.className =
          "ship-select-body " +
          (moving ? "ship-select-body--moving" : "ship-select-body--stationary");
        body.textContent = moving ? "▲" : "";
        // Match the locked overlay's current screen rotation when present.
        let rot = "";
        if (sourceIcon) {
          const srcBody = sourceIcon.querySelector(".ship-body");
          if (srcBody && srcBody.style && srcBody.style.transform) {
            rot = srcBody.style.transform;
          }
        }
        if (!rot && moving && typeof markerScreenRotationDeg === "function") {
          rot = "rotate(" + markerScreenRotationDeg(ship) + "deg)";
        }
        body.style.transform = rot || "";
      }

      function syncSelection() {
        const el = ensureIcon();
        if (selectedMmsi == null || selectedMmsi === "") {
          el.classList.remove("visible");
          rafId = requestAnimationFrame(syncSelection);
          return;
        }

        const markersRoot = document.getElementById(MARKERS_LAYER_ID);
        const source = markersRoot
          ? markersRoot.querySelector(
              '.ship-icon[data-mmsi="' + String(selectedMmsi) + '"]'
            )
          : null;
        const ship =
          typeof knownShips !== "undefined" ? knownShips[String(selectedMmsi)] : null;

        if (!source || source.style.display === "none" || !ship) {
          el.classList.remove("visible");
        } else {
          updateAppearance(ship, source);
          el.style.left = source.style.left || "";
          el.style.top = source.style.top || "";
          el.dataset.mmsi = String(selectedMmsi);
          el.classList.add("visible");
        }
        rafId = requestAnimationFrame(syncSelection);
      }

      window.setSelectedShipHighlight = function setSelectedShipHighlight(mmsi) {
        if (mmsi == null || mmsi === "" || mmsi === 0) {
          selectedMmsi = null;
          window.__projectxSelectedMmsi = null;
          if (iconEl) iconEl.classList.remove("visible");
          return;
        }
        selectedMmsi = String(mmsi);
        window.__projectxSelectedMmsi = selectedMmsi;
      };

      window.getSelectedShipHighlight = function getSelectedShipHighlight() {
        return selectedMmsi;
      };

      ensureLayer();
      if (!rafId) {
        rafId = requestAnimationFrame(syncSelection);
      }
    })();
  </script>
